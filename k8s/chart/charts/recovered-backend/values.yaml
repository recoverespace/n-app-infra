deployment:
  revisions: 1
  replicas: 1

pod:
  serviceAccount: gcp-sa
command:
  [
    "uvicorn",
    "api.main:app",
    "--host",
    "0.0.0.0",
    "--port",
    "8080",
    "--proxy-headers",
    "--log-level",
    "info",
  ]

service:
  ports:
    - port: 8080
      name: web

ingress:
  domain: "api.recoveredspace.com"
  tls:
    enabled: false
  class: traefik
  path: "/v1"
  pathType: ""
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "web, websecure"
    traefik.http.routers.blog.rule: "Host(`api.recoveredspace.com`) && Path(`/v1`)"
    traefik.http.routers.blog.tls: "true"
    traefik.http.routers.blog.tls.certresolver: "letsencrypt"

livenessProbe:
  httpGet:
  tcpSocket:
    host: 1.1.1.1 #CloudFlare
    port: 53 #DNS
  successThreshold: 1
  failureThreshold: 2
  initialDelaySeconds: 60

readinessProbe:
  httpGet:
  tcpSocket:
    host: 1.1.1.1 #CloudFlare
    port: 53 #DNS
  successThreshold: 1
  failureThreshold: 2
  initialDelaySeconds: 60

job:
  enabled: true
  name: migrations
  annotations:
    "helm.sh/hook": pre-upgrade
  restartPolicy: Never
  command: ["sh", "-c"]
  args:
    - |
      cd /app/data
      alembic upgrade head

  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 200Mi

resources:
  limits:
    cpu: 250m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 200Mi

worker:
  nameOverride: recovered-worker
  deployment:
    revisions: 1
    replicas: 1
  pod:
    serviceAccount: gcp-sa
  command: ["faststream", "run", "api.stream:app"]

  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 200Mi

  livenessProbe:
    httpGet:
    tcpSocket:
      host: 1.1.1.1 #CloudFlare
      port: 53 #DNS
    successThreshold: 1
    failureThreshold: 2
    initialDelaySeconds: 60

  readinessProbe:
    httpGet:
    tcpSocket:
      host: 1.1.1.1 #CloudFlare
      port: 53 #DNS
    successThreshold: 1
    failureThreshold: 2
    initialDelaySeconds: 60
