

services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_SCHEMA}
    networks:
      - backend
      - edge
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_SCHEMA}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:latest
    networks:
      - backend
  centrifugo:
    image: centrifugo/centrifugo:v5
    volumes:
      - ./config.json:/centrifugo/config.json:z
    command: centrifugo -c config.json -p 8008
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGE_SECRET}
      - CENTRIFUGO_API_KEY=${CENTRIFUGE_API_KEY}
    networks:
      - backend
      - edge
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_STACK}-recovered-network"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/connection`)"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo.service=${TRAEFIK_STACK}-centrifugo"
      - "traefik.http.services.${TRAEFIK_STACK}-centrifugo.loadbalancer.server.port=8008"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo-http.rule=Host(`${TRAEFIK_DOMAIN}`) && PathPrefix(`/connection`)"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo-http.entrypoints=web"
      - "traefik.http.routers.${TRAEFIK_STACK}-centrifugo-http.middlewares=redirect-to-https"

volumes:
  pg_data:

networks:
  backend:
    driver: bridge
  edge:
    external: true
    name: ${TRAEFIK_STACK}-recovered-network
